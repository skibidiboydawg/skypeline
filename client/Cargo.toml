[package]
name = "skypeline-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
skypeline-shared = { path = "../shared" }
eframe = "0.31.1"
egui = "0.31.1"
egui-phosphor = { version = "0.9.0", features = ["regular", "fill"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
cpal = "0.18"
opus1 = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = "0.6"
rfd = "0.15"
tracing = "0.1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
xcap = "0.4.1"

[dev-dependencies]
xcap = "0.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.21.3"
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"
