[package]
name = "skypeline-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
skypeline-shared = { path = "../shared" }
eframe = "0.31.1"
egui = "0.31.1"
egui-phosphor = { version = "0.9.0", features = ["regular", "fill"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
cpal = "0.18"
opus1 = "0.3"
xcap = "0.4.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.15"
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.21.3"

[build-dependencies]
cc = "1"
