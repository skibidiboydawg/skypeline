# Render Blueprint for the Skypeline relay server.
# Secrets are supplied in the Render dashboard at deploy time (sync: false).
services:
  - type: web
    name: skypeline-co
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Render routes public traffic to $PORT. The Dockerfile default (7860)
      # is only a container default; this overrides it on Render.
      - key: PORT
        value: 10000
      # Neon PostgreSQL connection string, e.g.
      # postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Long random value (32+ bytes). Generate with: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      # Managed Better Auth base URL for the Neon production branch.
      - key: NEON_AUTH_BASE_URL
        value: https://ep-lively-haze-baehoxza.neonauth.c-8.eu-central-1.aws.neon.tech/neondb/auth
      # Trusted origin Neon Auth uses when sending verification emails.
      - key: NEON_AUTH_ORIGIN
        value: https://skypeline-co.onrender.com
