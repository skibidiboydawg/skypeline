  function avColor(name, mine) {
    if (mine) return '#6366f1';
    let h = 2166136261;
    for (let i = 0; i < name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 16777619); }
    const pal = ['#6366f1','#22c55e','#f59e0b','#ec4899','#06b6d4'];
    return pal[Math.abs(h) % pal.length];
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtTime(sec) {
    const d = new Date(sec * 1000);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function fmtDay(sec) {
    const d = new Date(sec * 1000), n = new Date();
    const k = x => `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`;
    if (k(d) === k(n)) return 'Today';
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if (k(d) === k(y)) return 'Yesterday';
    return d.toLocaleDateString();
  }
  function renderMd(raw) {
    const parts = raw.split('```');
    return parts.map((part, i) => {
      if (i % 2 === 1) {
        const clean = part.replace(/^\n+|\n+$/g, '');
        return `<div class="code-block">${esc(clean)}</div>`;
      }
      let h = esc(part);
      h = h.replace(/\|\|([^|]+)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'open\')">$1</span>');
      h = h.replace(/`([^`]+)`/g, '<span class="code-inline">$1</span>');
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/__([^_]+)__/g, '<u>$1</u>');
      h = h.replace(/~~([^~]+)~~/g, '<s>$1</s>');
      h = h.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');
      h = h.replace(/(^|\s)(@[A-Za-z0-9_]+)/g, '$1<span class="mention">$2</span>');
      h = h.replace(/^&gt; (.+)$/gm, '<div style="border-left:3px solid currentColor;padding-left:8px;opacity:.85">$1</div>');
      return h.replace(/\n/g, '<br>');
    }).join('');
  }

  async function api(path, opts = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (state.session?.token) headers['Authorization'] = 'Bearer ' + state.session.token;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    let res;
    try {
      res = await fetch(BASE + path, Object.assign({}, opts, { headers, signal: ctrl.signal }));
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Server timed out — please try again in a few seconds.');
      throw e;
    } finally {
      clearTimeout(timer);
    }
    const txt = await res.text();
    if (!res.ok) {
      if (res.status === 401 && state.session) { signOut('Session expired.'); }
      throw new Error(txt || `HTTP ${res.status}`);
    }
    return txt ? JSON.parse(txt) : null;
  }

  // WebSocket + reconnect
  let ws = null, pingTimer = null, reconTimer = null;
  function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  function connectWs() {
    if (!state.session) return;
    if (ws) { try { ws.close(); } catch {} }
    ws = new WebSocket(`${WS_BASE}/ws?token=${encodeURIComponent(state.session.token)}`);
    ws.onopen = () => {
      state.connected = true;
      wsSend({ type: 'set_presence', status: state.prefs.status });
      if (state.inVoice && state.voiceRoom) wsSend({ type: 'join_voice', room: state.voiceRoom });
      clearInterval(pingTimer);
      pingTimer = setInterval(() => wsSend({ type: 'ping' }), 40000);
      loadChannels(); loadFriends(); render();
    };
    ws.onclose = () => {
      state.connected = false; clearInterval(pingTimer); render();
      if (state.session) { clearTimeout(reconTimer); reconTimer = setTimeout(connectWs, 2500); }
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      handleWs(m);
    };
  }

  function pushToast(chId, sender, preview) {
    const id = Date.now() + Math.random();
    state.toasts.push({ id, chId, sender, preview, closing: false });
    if (state.toasts.length > 3) state.toasts.shift();
    renderToasts();
    setTimeout(() => {
      const t = state.toasts.find(x => x.id === id);
      if (t && !t.closing) { t.closing = true; renderToasts(); setTimeout(() => { state.toasts = state.toasts.filter(x => x.id !== id); renderToasts(); }, 200); }
    }, 4000);
  }

  function handleWs(m) {
    const meId = state.session?.user_id;
    switch (m.type) {
      case 'presence_snapshot':
        state.online = {};
        for (const u of m.users) state.online[u.user_id] = u.status;
        for (const f of state.friends) {
          f.online = !!state.online[f.user_id];
          f.presence = state.online[f.user_id] || 'offline';
        }
        render(); break;
      case 'friends_updated': loadFriends(); break;
      case 'channels_updated': loadChannels(); break;
      case 'new_message': {
        const msg = m.message;
        state.lastMessages[msg.channel_id] = { text: msg.content, ts: msg.created_at };
        if (state.typing[msg.channel_id]) delete state.typing[msg.channel_id][msg.user_id];
        if (state.selectedChannel === msg.channel_id) {
          msg._isNew = true;
          state.messages.push(msg);
          if (msg.user_id !== meId) SFX.recv();
          render();
          setTimeout(() => { const s = document.getElementById('msg-scroll'); if (s) s.scrollTop = s.scrollHeight; }, 20);
        } else if (msg.user_id !== meId) {
          state.unread[msg.channel_id] = (state.unread[msg.channel_id] || 0) + 1;
          SFX.recv();
          pushToast(msg.channel_id, msg.username, msg.content);
          render();
        }
        break;
      }
      case 'message_edited':
        if (state.selectedChannel === m.channel_id) {
          const msg = state.messages.find(x => x.id === m.message_id);
          if (msg) { msg.content = m.content; msg.edited_at = m.edited_at; render(); }
        }
        break;
      case 'message_deleted':
        if (state.selectedChannel === m.channel_id) {
          state.messages = state.messages.filter(x => x.id !== m.message_id);
          render();
        }
        break;
      case 'reaction_updated':
        if (state.selectedChannel === m.channel_id) {
          const msg = state.messages.find(x => x.id === m.message_id);
          if (msg) {
            msg.reactions = msg.reactions || [];
            let r = msg.reactions.find(x => x.emoji === m.emoji);
            if (m.added) {
              if (!r) { r = { emoji: m.emoji, user_ids: [] }; msg.reactions.push(r); }
              if (!r.user_ids.includes(m.user_id)) r.user_ids.push(m.user_id);
            } else if (r) {
              r.user_ids = r.user_ids.filter(u => u !== m.user_id);
              msg.reactions = msg.reactions.filter(x => x.user_ids.length > 0);
            }
            render();
          }
        }
        break;
      case 'typing':
        state.typing[m.channel_id] = state.typing[m.channel_id] || {};
        state.typing[m.channel_id][m.user_id] = { name: m.username, exp: Date.now() + 4000 };
        renderTyping();
        setTimeout(renderTyping, 4100);
        break;
      case 'voice_state': {
        const chId = Number(m.room.replace('channel:', ''));
        if (chId) {
          if (m.participants && m.participants.length > 0) state.activeCalls[chId] = m.participants;
          else delete state.activeCalls[chId];
        }
        const inRoom = state.inVoice && state.voiceRoom === m.room;
        if (!inRoom) {
          const caller = m.participants.find(p => p.user_id !== meId);
          if (caller && chId) {
            if (!state.incomingCall || state.incomingCall.chId !== chId) {
              state.incomingCall = { chId, caller: caller.username };
              SFX.ring();
            }
          } else if (state.incomingCall?.chId === chId) {
            state.incomingCall = null;
          }
          render();
        } else {
          state.participants = m.participants;
          render();
        }
        break;
      }
      case 'screen_frame': {
        const img = document.getElementById('live-screen-img');
        const pip = document.getElementById('live-screen-pip');
        const src = 'data:image/jpeg;base64,' + m.jpeg_b64;
        state.screenSrc = src;
        state.screenMeta = `${m.from_username} · ${m.width}x${m.height}`;
        if (img) { img.src = src; }
        else if (pip) { pip.src = src; }
        else { render(); }
        break;
      }
      case 'screen_share_stopped':
        state.screenSrc = null; state.screenMeta = ''; state.streamMinimized = false; render(); break;
    }
  }

  async function loadChannels() {
    try { state.channels = await api('/api/channels'); render(); } catch {}
  }
  async function loadFriends() {
    try { state.friends = await api('/api/friends'); render(); } catch {}
  }
  async function selectChannel(id) {
    state.selectedChannel = id;
    state.draft = '';
    state.mobileSidebarOpen = false;
    delete state.unread[id];
    state.replyTo = null; state.editingId = null; state.msgSearchOpen = false; state.msgSearch = '';
    SFX.click();
    render();
    try {
      state.messages = await api(`/api/messages/${id}?limit=50`);
      const last = state.messages[state.messages.length - 1];
      if (last) state.lastMessages[id] = { text: last.content, ts: last.created_at };
      render();
      setTimeout(() => {
        const s = document.getElementById('msg-scroll'); if (s) s.scrollTop = s.scrollHeight;
        const inp = document.getElementById('draft-input'); if (inp) inp.focus();
      }, 20);
    } catch {}
  }
  async function openDm(userId, callAfter = false) {
    try {
      const ch = await api(`/api/dm/${userId}`, { method: 'POST' });
      if (!state.channels.find(c => c.id === ch.id)) state.channels.push(ch);
      await selectChannel(ch.id);
      if (callAfter) startCall(ch.id);
    } catch (e) { alert(e.message); }
  }

  // Screen Sharing (Chromebook / Browser getDisplayMedia -> 15/30/60 FPS, max 1080p JPEG)
  let screenStream = null, screenTimer = null, screenVideo = null, screenCanvas = null;
  async function toggleScreenShare() {
    if (!state.inVoice) return;
    if (state.sharing) {
      stopScreenShare();
      SFX.shareOff();
      render();
      return;
    }
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({
        video: {
          cursor: 'always',
          frameRate: { ideal: state.prefs.screenFps, max: 60 },
          height: { ideal: state.prefs.screenRes, max: 1080 }
        },
        audio: false
      });
      screenVideo = document.createElement('video');
      screenVideo.srcObject = screenStream; screenVideo.muted = true;
      await screenVideo.play();
      screenCanvas = document.createElement('canvas');
      state.sharing = true;
      wsSend({ type: 'set_screen_share', room: state.voiceRoom, active: true });
      SFX.shareOn();
      screenStream.getVideoTracks()[0].onended = () => { stopScreenShare(); render(); };
      runScreenLoop();
      render();
    } catch {}
  }
  function runScreenLoop() {
    clearTimeout(screenTimer);
    if (!state.sharing || !screenVideo) return;
    const t0 = performance.now();
    const vw = screenVideo.videoWidth, vh = screenVideo.videoHeight;
    if (vw > 0 && vh > 0) {
      const maxH = state.prefs.screenRes, maxW = Math.min(1920, Math.round(maxH * 16 / 9));
      const scale = Math.min(1, maxW / vw, maxH / vh);
      const w = Math.max(1, Math.round(vw * scale)), h = Math.max(1, Math.round(vh * scale));
      screenCanvas.width = w; screenCanvas.height = h;
      const ctx = screenCanvas.getContext('2d');
      ctx.drawImage(screenVideo, 0, 0, w, h);
      const q = state.prefs.screenFps >= 60 ? 0.42 : state.prefs.screenFps >= 30 ? 0.56 : 0.7;
      const dataUrl = screenCanvas.toDataURL('image/jpeg', q);
      const b64 = dataUrl.split(',')[1];
      state.screenSrc = dataUrl;
      state.screenMeta = `You · ${w}x${h} · ${state.prefs.screenFps} FPS`;
      const img = document.getElementById('live-screen-img');
      if (img) img.src = dataUrl;
      if (ws && ws.readyState === 1 && ws.bufferedAmount < 262144) {
        wsSend({ type: 'screen_frame', room: state.voiceRoom, width: w, height: h, jpeg_b64: b64 });
      }
    }
    const interval = 1000 / state.prefs.screenFps;
    const wait = Math.max(1, interval - (performance.now() - t0));
    screenTimer = setTimeout(runScreenLoop, wait);
  }
  function stopScreenShare() {
    clearTimeout(screenTimer);
    if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
    if (state.sharing && state.voiceRoom) wsSend({ type: 'set_screen_share', room: state.voiceRoom, active: false });
    state.sharing = false; state.screenSrc = null; state.screenMeta = '';
  }

  // Voice call state
  let micStream = null;
  async function startCall(chId) {
    const room = `channel:${chId}`;
    if (state.inVoice && state.voiceRoom === room) { state.callExpanded = true; render(); return; }
    if (state.inVoice) leaveCall();
    state.inVoice = true; state.callExpanded = true; state.voiceRoom = room;
    state.callStart = Date.now(); state.incomingCall = null;
    wsSend({ type: 'join_voice', room });
    SFX.callJoin();
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch {}
    render();
  }
  function leaveCall() {
    stopScreenShare();
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (state.inVoice) { wsSend({ type: 'leave_voice' }); SFX.callLeave(); }
    state.inVoice = false; state.voiceRoom = null; state.participants = [];
    render();
  }

  function signOut(msg = '') {
    leaveCall();
    if (ws) { try { ws.close(); } catch {} ws = null; }
    state.session = null; state.channels = []; state.friends = []; state.messages = [];
    state.selectedChannel = null; state.showSettings = false; state.showProfilePop = false;
    state.notice = msg; state.noticeErr = !!msg;
    localStorage.removeItem('wl_session');
    render();
  }

  let lastTypingSent = 0;
  function sendDraft() {
    const inp = document.getElementById('draft-input');
    const text = (inp ? inp.value : state.draft).trim();
    if (!text || !state.selectedChannel) return;
    const replyId = state.replyTo?.id || null;
    // Clear draft BEFORE wsSend so fast/synchronous echoes can never restore stale draft text!
    state.draft = '';
    if (inp) inp.value = '';
    state.replyTo = null;
    state.showAttachMenu = false;
    wsSend({ type: 'send_message', channel_id: state.selectedChannel, content: text, reply_to_id: replyId });
    SFX.send();
    render();
    setTimeout(() => { const el = document.getElementById('draft-input'); if (el) el.focus(); }, 10);
  }

  function renderTyping() {
    const el = document.getElementById('typing-row');
    if (!el || !state.selectedChannel) return;
    const map = state.typing[state.selectedChannel] || {};
    const now = Date.now();
    const names = Object.values(map).filter(x => x.exp > now).map(x => x.name);
    if (names.length) {
      el.classList.add('show');
      el.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span><span>${esc(names.join(', '))} ${names.length === 1 ? 'is' : 'are'} typing...</span>`;
    } else {
      el.classList.remove('show');
    }
  }

  function renderToasts() {
    let wrap = document.getElementById('toast-stack');
    if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toast-stack'; wrap.className = 'toast-stack'; document.body.appendChild(wrap); }
    wrap.innerHTML = state.toasts.map(t => `
      <div class="toast-item ${t.closing ? 'toast-exit' : 'toast-enter'}" data-toast-ch="${t.chId}">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div class="avatar" style="width:32px;height:32px;background:${avColor(t.sender,false)};font-size:13px">${esc(t.sender[0]?.toUpperCase() || '?')}</div>
          <div style="min-width:0;flex:1">
            <div style="font-weight:600;font-size:13.5px">${esc(t.sender)}</div>
            <div style="font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.preview)}</div>
          </div>
        </div>
        <div class="toast-bar"></div>
      </div>`).join('');
    wrap.querySelectorAll('[data-toast-ch]').forEach(el => {
      el.onclick = () => { selectChannel(Number(el.dataset.toastCh)); state.toasts = []; renderToasts(); };
    });
  }

  function formatPreview(txt) {
    if (!txt) return '';
    if (txt === '[[call:started]]') return 'Started a call';
    if (txt === '[[call:missed]]') return 'Missed call';
    if (txt.startsWith('[[call:ended:') && txt.endsWith(']]')) return 'Call ended · ' + txt.slice(13, -2);
    return txt;
  }

  function ensureAvatar(userId, hash) {
    if (!userId || !hash || !state.session) return null;
    const cached = state.avatars[userId];
    if (cached && cached.hash === hash) return cached.url;
    const key = `${userId}:${hash}`;
    if (!state.avatarRequested[key]) {
      state.avatarRequested[key] = true;
      api(`/api/avatar/${userId}`).then(info => {
        state.avatars[userId] = { hash: info.hash, url: `data:${info.mime};base64,${info.data_base64}` };
        render();
      }).catch(() => {});
    }
    return cached?.url || null;
  }

  function avatarHashFor(userId) {
    if (state.session && state.session.user_id === userId) return state.session.avatar_hash;
    const f = state.friends.find(x => x.user_id === userId);
    return f?.avatar_hash || null;
  }

  function avatarHtml(userId, name, size, mine, statusHtml = '') {
    const hash = avatarHashFor(userId);
    const url = ensureAvatar(userId, hash);
    const fs = Math.round(size * 0.4);
    if (url) {
      return `<div class="avatar" style="width:${size}px;height:${size}px"><img src="${url}" alt="${esc(name)}" />${statusHtml}</div>`;
    }
    return `<div class="avatar" style="width:${size}px;height:${size}px;background:${avColor(name, mine)};font-size:${fs}px">${esc(name[0]?.toUpperCase() || '?')}${statusHtml}</div>`;
  }

  async function uploadAvatarFile(file) {
    if (!file || !state.session) return;
    try {
      const img = await new Promise((resolve, reject) => {
        const u = URL.createObjectURL(file);
        const el = new Image();
        el.onload = () => { URL.revokeObjectURL(u); resolve(el); };
        el.onerror = () => { URL.revokeObjectURL(u); reject(new Error('Could not decode image')); };
        el.src = u;
      });
      const side = Math.min(img.width, img.height);
      const sx = Math.floor((img.width - side) / 2);
      const sy = Math.floor((img.height - side) / 2);
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);
      ctx.drawImage(img, sx, sy, side, side, 0, 0, 128, 128);
      const pixels = ctx.getImageData(0, 0, 128, 128).data;
      let hasAlpha = false;
      for (let i = 3; i < pixels.length; i += 4) { if (pixels[i] < 255) { hasAlpha = true; break; } }
      const mime = hasAlpha ? 'image/png' : 'image/jpeg';
      const dataUrl = hasAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.82);
      const b64 = dataUrl.split(',')[1];
      let h = 2166136261;
      for (let i = 0; i < b64.length; i++) { h ^= b64.charCodeAt(i); h = Math.imul(h, 16777619); }
      const hash = (h >>> 0).toString(16).padStart(8, '0') + Date.now().toString(16).slice(-8);
      const info = await api('/api/avatar', { method: 'POST', body: JSON.stringify({ mime, data_base64: b64, hash }) });
      state.session.avatar_hash = info.hash;
      localStorage.setItem('wl_session', JSON.stringify(state.session));
      state.avatars[info.user_id] = { hash: info.hash, url: `data:${info.mime};base64,${info.data_base64}` };
      pushToast('Profile Picture', 'Updated successfully!', null);
      SFX.react();
      render();
    } catch (err) {
      pushToast('Upload Failed', err.message || 'Could not upload avatar', null);
    }
  }

  const prevOverlays = { settings: false, profilePop: false, emoji: false, attach: false };

  function render() {
    const animSettings = state.showSettings && !prevOverlays.settings;
    const animProfilePop = state.showProfilePop && !prevOverlays.profilePop;
    const animEmoji = (state.emojiTarget !== undefined) && !prevOverlays.emoji;
    const animAttach = state.showAttachMenu && !prevOverlays.attach;
    prevOverlays.settings = !!state.showSettings;
    prevOverlays.profilePop = !!state.showProfilePop;
    prevOverlays.emoji = state.emojiTarget !== undefined;
    prevOverlays.attach = !!state.showAttachMenu;

    // Preserve active text input focus, cursor selection, and draft text across live re-renders!
    const activeEl = document.activeElement;
    const prevFocus = activeEl && activeEl.id ? {
      id: activeEl.id,
      selStart: typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null,
      selEnd: typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null,
    } : null;
    const prevScrollEl = document.getElementById('msg-scroll');
    const wasAtBottom = prevScrollEl ? (prevScrollEl.scrollHeight - prevScrollEl.scrollTop - prevScrollEl.clientHeight < 60) : true;
    const prevScrollTop = prevScrollEl ? prevScrollEl.scrollTop : 0;
    if (activeEl && activeEl.id === 'draft-input') state.draft = activeEl.value;

    const root = document.getElementById('root');
    if (!state.session) {
      root.innerHTML = `
        <div class="auth-wrap">
          <form class="auth-card" id="auth-form">
            <h1>${state.authTab === 'login' ? 'Sign in to Wireline' : 'Create your account'}</h1>
            <div class="auth-sub">Private chats, voice calls & screen sharing — works everywhere.</div>
            <label class="field-label">EMAIL</label>
            <input class="text-input" id="auth-email" type="email" required placeholder="you@example.com" value="${esc(state.authEmail || '')}" />
            ${state.authTab === 'register' ? `<label class="field-label">USERNAME</label><input class="text-input" id="auth-user" required placeholder="Username" value="${esc(state.authUser || '')}" />` : ''}
            <label class="field-label">PASSWORD</label>
            <input class="text-input" id="auth-pass" type="password" required placeholder="${state.authTab === 'register' ? '8+ characters' : ''}" />
            <button class="btn-primary" type="submit" ${state.busy ? 'disabled' : ''}>${state.authTab === 'login' ? 'Sign In' : 'Create Account'}</button>
            ${state.notice ? `<div class="notice ${state.noticeErr ? 'err' : ''}">${esc(state.notice)}</div>` : ''}
            <div class="auth-footer">
              ${state.authTab === 'login'
                ? 'New here? <a id="auth-switch">Create an account</a>'
                : 'Already have an account? <a id="auth-switch">Sign in</a>'}
            </div>
          </form>
        </div>`;
      document.getElementById('auth-switch').onclick = () => { state.authTab = state.authTab === 'login' ? 'register' : 'login'; state.notice = ''; render(); };
      document.getElementById('auth-form').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('auth-email').value.trim();
        const username = state.authTab === 'register' ? (document.getElementById('auth-user')?.value.trim() || '') : '';
        const password = document.getElementById('auth-pass').value;
        state.authEmail = email;
        state.authUser = username;
        state.busy = true; state.notice = 'Working...'; state.noticeErr = false; render();
        try {
          if (state.authTab === 'register') {
            await api('/api/register', { method: 'POST', body: JSON.stringify({ email, username, password }) });
          }
          const resp = await api('/api/login', { method: 'POST', body: JSON.stringify({ email, password }) });
          state.session = resp; localStorage.setItem('wl_session', JSON.stringify(resp));
          state.authEmail = ''; state.authUser = '';
          state.busy = false; state.notice = ''; connectWs(); render();
        } catch (err) {
          state.busy = false; state.notice = err.message; state.noticeErr = true; render();
        }
      };
      return;
    }

    const me = state.session;
    const pendingIn = state.friends.filter(f => f.status === 'pending' && f.direction === 'incoming').length;
    const pendingAll = state.friends.filter(f => f.status === 'pending').length;
    const onPeople = state.selectedChannel === null;
    const activeCh = state.channels.find(c => c.id === state.selectedChannel);
    const inThisCall = state.inVoice && activeCh && state.voiceRoom === `channel:${activeCh.id}`;

    const dms = state.channels
      .filter(c => c.kind === 'dm' && (!state.chatSearch || c.name.toLowerCase().includes(state.chatSearch.toLowerCase())))
      .sort((a, b) => (state.lastMessages[b.id]?.ts || b.id) - (state.lastMessages[a.id]?.ts || a.id));

    root.innerHTML = `
      <div class="shell">
        ${state.mobileSidebarOpen ? '<div class="mobile-drawer-bg" id="mobile-drawer-bg"></div>' : ''}
        <aside class="sidebar ${state.mobileSidebarOpen ? 'mobile-open' : ''}">
          <div class="profile-top">
            <div class="profile-chip" id="btn-profile-pop">
              ${avatarHtml(me.user_id, me.username, 38, true, `<span class="status-dot dot-${state.prefs.status}"></span>`)}
              <div style="min-width:0;flex:1">
                <div style="font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(me.username)}</div>
                <div style="font-size:12px;color:var(--text-muted);text-transform:capitalize">${esc(state.prefs.status)}</div>
              </div>
            </div>
            <button class="icon-btn" id="btn-theme" title="Toggle Dark/Light Mode">${state.prefs.theme === 'dark' ? SVG.sun : SVG.moon}</button>
            <button class="icon-btn" id="btn-settings" title="Settings">${SVG.gear}</button>
          </div>

          <div class="side-body">
            <div class="seg-switch">
              <button class="seg-btn ${!onPeople ? 'active' : ''}" id="nav-chats">${SVG.chat} Chats</button>
              <button class="seg-btn ${onPeople ? 'active' : ''}" id="nav-people">${SVG.users} People ${pendingIn > 0 ? `<span class="pill-badge badge-pop">${pendingIn}</span>` : ''}</button>
            </div>
            <div class="search-pill">${SVG.search}<input id="side-search" placeholder="Search conversations..." value="${esc(state.chatSearch)}" /></div>
            <div class="sec-row">
              <span class="sec-label">CONVERSATIONS</span>
              <button class="icon-btn" style="width:24px;height:24px" id="btn-new-dm" title="New Chat">${SVG.plus}</button>
            </div>
            <div class="dm-list">
              ${dms.length ? dms.map(c => {
                const st = state.online[c.peer_user_id] || 'offline';
                const last = state.lastMessages[c.id];
                const un = state.unread[c.id] || 0;
                const callUsers = state.activeCalls[c.id] || [];
                return `<div class="dm-card ${state.selectedChannel === c.id ? 'active' : ''}" data-ch="${c.id}">
                  ${avatarHtml(c.peer_user_id, c.name, 38, false, `<span class="status-dot dot-${st}"></span>`)}
                  <div class="dm-meta">
                    <div class="dm-top">
                      <span class="dm-name">${esc(c.name)}</span>
                      ${last ? `<span class="dm-time">${fmtTime(last.ts)}</span>` : ''}
                    </div>
                    ${last ? `<div class="dm-prev" style="${un ? 'color:var(--text-primary);font-weight:500' : ''}">${esc(formatPreview(last.text))}</div>` : ''}
                  </div>
                  ${callUsers.length ? `<span class="pill-badge green" style="gap:3px">${SVG.phone} Call</span>` : (un ? `<span class="pill-badge">${un}</span>` : '')}
                </div>`;
              }).join('') : `<div style="text-align:center;padding:28px 0;color:var(--text-muted);font-size:13px">No conversations yet</div>`}
            </div>
          </div>

          ${state.inVoice ? `
            <div class="call-float-card">
              <div style="font-size:13px;font-weight:600;color:var(--success)">Voice Active ${state.sharing ? '· Sharing' : ''}</div>
              <div class="call-float-btns">
                <button id="side-mute" class="${state.muted ? 'on-danger' : ''}" title="Mute">${state.muted ? SVG.micOff : SVG.mic}</button>
                <button id="side-deaf" class="${state.deafened ? 'on-danger' : ''}" title="Deafen">${SVG.headphones}</button>
                <button id="side-share" class="${state.sharing ? 'on-success' : ''}" title="Share Screen">${SVG.screen}</button>
                <button id="side-hangup" class="on-danger" title="End Call">${SVG.phoneOff}</button>
              </div>
            </div>` : state.incomingCall ? `
            <div class="call-float-card" style="border-color:var(--accent)">
              <div style="font-weight:600;font-size:14px">${esc(state.incomingCall.caller)}</div>
              <div style="font-size:12px;color:var(--success);margin-bottom:8px">Incoming voice call...</div>
              <div style="display:flex;gap:8px">
                <button id="ans-call" style="flex:1;height:32px;border-radius:8px;background:var(--success);color:#fff;font-weight:600;font-size:13px">Answer</button>
                <button id="dec-call" style="flex:1;height:32px;border-radius:8px;background:var(--danger);color:#fff;font-weight:600;font-size:13px">Decline</button>
              </div>
            </div>` : ''}
        </aside>

        <main class="main">
          ${activeCh ? renderChat(activeCh, inThisCall, me, animAttach) : renderPeople(pendingAll)}
        </main>
      </div>
      ${state.showProfilePop ? renderProfilePop(me, animProfilePop) : ''}
      ${state.emojiTarget !== undefined ? renderEmojiPicker(animEmoji) : ''}
      ${state.showSettings ? renderSettings(animSettings) : ''}
    `;

    bindEvents(activeCh);
    renderTyping();
    renderToasts();

    // Restore chat scroll and text input focus/caret cleanly so incoming messages never disrupt typing!
    const newScrollEl = document.getElementById('msg-scroll');
    if (newScrollEl) {
      newScrollEl.scrollTop = wasAtBottom ? newScrollEl.scrollHeight : prevScrollTop;
    }
    if (prevFocus) {
      const restored = document.getElementById(prevFocus.id);
      if (restored) {
        restored.focus();
        if (prevFocus.selStart !== null && typeof restored.setSelectionRange === 'function') {
          try { restored.setSelectionRange(prevFocus.selStart, prevFocus.selEnd); } catch {}
        }
      }
    }
  }

  function renderChat(ch, inThisCall, me, animAttach = false) {
    const peerSt = state.online[ch.peer_user_id] || 'offline';
    const q = state.msgSearchOpen ? state.msgSearch.trim().toLowerCase() : '';
    const msgs = state.messages.filter(m => !q || m.content.toLowerCase().includes(q) || m.username.toLowerCase().includes(q));
    let lastDay = '';
    const msgHtml = msgs.map((m, i) => {
      const day = fmtDay(m.created_at);
      const sep = day !== lastDay ? `<div class="date-pill">${esc(day)}</div>` : '';
      lastDay = day;
      if (m.content.startsWith('[[call:') && m.content.endsWith(']]')) {
        const isMissed = m.content === '[[call:missed]]';
        const isStart = m.content === '[[call:started]]';
        const label = isStart
          ? `${m.username} started a call · ${fmtTime(m.created_at)}`
          : isMissed
            ? `Missed call from ${m.username} · ${fmtTime(m.created_at)}`
            : `Call ended · ${m.content.slice(13, -2)} · ${fmtTime(m.created_at)}`;
        const col = isStart ? 'var(--success)' : isMissed ? 'var(--danger)' : 'var(--text-secondary)';
        return `${sep}<div class="call-event-card ${isMissed ? 'missed' : ''}"><span style="color:${col};display:inline-flex">${isMissed ? SVG.phoneOff : SVG.phone}</span><span>${esc(label)}</span></div>`;
      }
      const mine = m.user_id === me.user_id;
      const prev = msgs[i - 1];
      const next = msgs[i + 1];
      const prevWasCall = prev && prev.content.startsWith('[[call:') && prev.content.endsWith(']]');
      const nextIsCall = next && next.content.startsWith('[[call:') && next.content.endsWith(']]');
      const grouped = !sep && !prevWasCall && !m.reply_to_id && prev && prev.user_id === m.user_id && Math.abs(m.created_at - prev.created_at) < 300;
      const hasNextInGroup = !nextIsCall && next && !next.reply_to_id && next.user_id === m.user_id && fmtDay(next.created_at) === day && Math.abs(next.created_at - m.created_at) < 300;
      const refMsg = m.reply_to_id ? state.messages.find(x => x.id === m.reply_to_id) : null;
      const newCls = m._isNew ? 'msg-new' : '';
      if (m._isNew) m._isNew = false;

      const reacts = (m.reactions || []).length ? `<div class="reactions">${m.reactions.map(r =>
        `<button class="react-pill ${r.user_ids.includes(me.user_id) ? 'mine' : ''}" data-react-msg="${m.id}" data-react-em="${esc(r.emoji)}">${esc(r.emoji)} ${r.user_ids.length}</button>`
      ).join('')}</div>` : '';

      return `${sep}<div class="msg-row ${mine ? 'mine' : 'theirs'} ${grouped ? 'grouped' : ''} ${hasNextInGroup ? 'has-next' : ''} ${newCls}" style="${!grouped && i > 0 ? 'margin-top:9px' : ''}">
        <div class="hover-bar">
          <button data-open-em="${m.id}" title="React">${SVG.smile}</button>
          <button data-reply="${m.id}" title="Reply">${SVG.reply}</button>
          ${mine ? `<button data-edit="${m.id}" title="Edit">${SVG.edit}</button><button class="del" data-del="${m.id}" title="Delete">${SVG.trash}</button>` : ''}
        </div>
        <div class="msg-inner">
          ${!mine ? (grouped ? '<div style="width:38px;flex-shrink:0"></div>' : avatarHtml(m.user_id, m.username, 38, false)) : ''}
          <div style="display:flex;flex-direction:column;align-items:${mine ? 'flex-end' : 'flex-start'};min-width:0">
            ${!mine && !grouped ? `<div class="msg-meta" style="margin-bottom:3px"><strong style="color:var(--text-primary);font-size:14px">${esc(m.username)}</strong><span>${fmtTime(m.created_at)}</span></div>` : ''}
            ${m.reply_to_id ? `<div class="reply-chip">${refMsg ? `<b>${esc(refMsg.username)}</b> ${esc(refMsg.content.length > 52 ? refMsg.content.slice(0, 52).trimEnd() + '…' : refMsg.content)}` : 'Original message deleted'}</div>` : ''}
            ${state.editingId === m.id ? `
              <div style="display:flex;gap:6px;align-items:center">
                <input class="text-input" id="edit-input" style="width:280px;padding:6px 10px" value="${esc(state.editDraft)}" />
                <button id="save-edit" class="opt-btn active" style="padding:6px 10px">Save</button>
                <button id="cancel-edit" class="opt-btn" style="padding:6px 10px">Cancel</button>
              </div>` : `<div class="bubble">${renderMd(m.content)}</div>`}
            ${reacts}
            ${mine && (!hasNextInGroup || m.edited_at) ? `<div class="msg-meta">${m.edited_at ? '<span>(edited)</span>' : ''}<span>${fmtTime(m.created_at)}</span></div>` : ''}
            ${!mine && m.edited_at ? `<div class="msg-meta">(edited)</div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');

    const roomCallers = state.activeCalls[ch.id] || [];
    const peerWaiting = !inThisCall && roomCallers.length > 0;
    const allCallUsers = [
      { user_id: me.user_id, username: me.username, speaking: state.participants.some(x => x.user_id === me.user_id && x.speaking), muted: state.muted, mine: true },
      ...state.participants.filter(x => x.user_id !== me.user_id).map(pt => ({ user_id: pt.user_id, username: pt.username, speaking: pt.speaking, muted: pt.muted, mine: false }))
    ];

    return `
      <header class="topbar" style="padding:0 24px">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu-btn" id="btn-mobile-menu" title="Conversations">${SVG.menu}</button>
          ${avatarHtml(ch.peer_user_id, ch.name, 38, false, `<span class="status-dot dot-${peerSt}" style="border-color:var(--canvas)"></span>`)}
          <div style="min-width:0">
            <div style="font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ch.name)}</div>
            <div style="font-size:12.5px;color:${peerSt === 'online' ? 'var(--success)' : 'var(--text-muted)'};text-transform:capitalize">${esc(peerSt)}</div>
          </div>
        </div>
        <div class="topbar-right">
          ${state.msgSearchOpen ? `
            <div class="search-pill" style="width:220px"><input id="msg-search-input" placeholder="Search messages..." value="${esc(state.msgSearch)}" /><button id="close-msg-search">${SVG.x}</button></div>
          ` : `
            <button class="call-pill-btn ${inThisCall || peerWaiting ? 'in-call' : ''}" id="btn-call">${SVG.phone} ${inThisCall ? 'In Call' : (peerWaiting ? 'Join Call' : 'Call')}</button>
            <button class="icon-btn" id="btn-msg-search" title="Search">${SVG.search}</button>
          `}
        </div>
      </header>

      ${peerWaiting ? `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 24px;background:rgba(34,197,94,0.13);border-bottom:1px solid rgba(34,197,94,0.35);gap:12px">
          <div style="display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600">
            <span style="color:var(--success);display:inline-flex">${SVG.phone}</span>
            <span>${esc(roomCallers.map(x => x.username).join(', '))} ${roomCallers.length === 1 ? 'is' : 'are'} in a call right now</span>
          </div>
          <button class="call-pill-btn in-call" id="btn-join-waiting" style="height:30px;padding:0 12px;font-size:12.5px">Join Call</button>
        </div>` : ''}

      ${inThisCall && state.callExpanded ? `
        <div class="call-stage-wrap">
          <div class="call-stage" id="call-stage" style="height:${state.prefs.callHeight}px">
            <div class="call-stage-hdr">
              <div style="display:flex;align-items:center;gap:8px">
                <strong style="font-size:13.5px">${esc(ch.name)}</strong>
                ${state.sharing || state.screenSrc ? `<span class="live-pill">LIVE</span><span style="font-size:11.5px;color:#a6b0c6">${esc(state.screenMeta)}</span>` : ''}
              </div>
              <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
                <button class="mini-pill ${state.prefs.screenRes===480?'active':''}" data-res="480">480p</button>
                <button class="mini-pill ${state.prefs.screenRes===720?'active':''}" data-res="720">720p</button>
                <button class="mini-pill ${state.prefs.screenRes===1080?'active':''}" data-res="1080">1080p</button>
                <button class="mini-pill ${state.prefs.screenFps===15?'active':''}" data-fps="15">15fps</button>
                <button class="mini-pill ${state.prefs.screenFps===30?'active':''}" data-fps="30">30fps</button>
                <button class="mini-pill ${state.prefs.screenFps===60?'active':''}" data-fps="60">60fps</button>
                <button class="mini-pill" data-csz="200">S</button>
                <button class="mini-pill" data-csz="320">M</button>
                <button class="mini-pill" data-csz="480">L</button>
                ${state.screenSrc ? `<button class="mini-pill ${state.streamMinimized?'active':''}" id="btn-toggle-stream">${state.streamMinimized ? 'Show Stream' : 'Hide Stream'}</button>` : ''}
                <button class="mini-pill" id="btn-hide-call">Hide</button>
              </div>
            </div>
            <div class="call-stage-body" style="flex-direction:column;position:relative">
              ${state.screenSrc && !state.streamMinimized ? `
                <img id="live-screen-img" class="screen-view" style="max-height:calc(100% - 34px)" src="${state.screenSrc}" />
                <div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px">
                  ${allCallUsers.map(u => `<div style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 5px;border-radius:99px;background:#171b26;border:1.5px solid ${u.speaking ? 'var(--success)' : 'rgba(255,255,255,0.08)'};font-size:11.5px;font-weight:600">${avatarHtml(u.user_id, u.username, 20, u.mine)}<span>${esc(u.username)}</span>${u.muted ? `<span style="color:var(--danger);display:inline-flex">${SVG.micOff}</span>` : ''}</div>`).join('')}
                </div>
              ` : `
                <div style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap">
                  ${allCallUsers.map(u => `<div class="p-tile ${u.speaking?'speaking':''}">${avatarHtml(u.user_id, u.username, 52, u.mine)}<span class="p-tile-name">${esc(u.username)}</span></div>`).join('')}
                </div>
                ${state.screenSrc && state.streamMinimized ? `
                  <div id="pip-expand" title="Click to expand stream" style="position:absolute;right:14px;bottom:6px;width:132px;height:74px;border-radius:8px;overflow:hidden;border:1.5px solid var(--accent);cursor:pointer;background:#000">
                    <img id="live-screen-pip" src="${state.screenSrc}" style="width:100%;height:100%;object-fit:contain" />
                    <span class="live-pill" style="position:absolute;top:4px;left:4px;font-size:8.5px;padding:1px 6px">LIVE</span>
                  </div>` : ''}
              `}
            </div>
            <div class="call-stage-dock">
              <button class="call-circle ${state.sharing ? 'on-green' : ''}" id="stage-share" title="Share Screen">${SVG.screen}</button>
              <button class="call-circle ${state.muted ? 'on-white' : ''}" id="stage-mute" title="Mute">${state.muted ? SVG.micOff : SVG.mic}</button>
              <button class="call-circle ${state.deafened ? 'on-white' : ''}" id="stage-deaf" title="Deafen">${SVG.headphones}</button>
              <button class="call-circle on-red" id="stage-hangup" title="End Call">${SVG.phoneOff}</button>
            </div>
          </div>
          <div class="resize-grip" id="call-resize-grip" title="Drag to resize voice call"><span></span></div>
        </div>` : ''}

      <div class="msg-scroll" id="msg-scroll">
        <div class="msg-column">
          <div style="text-align:center;padding:24px 0 12px;display:flex;flex-direction:column;align-items:center">
            ${avatarHtml(ch.peer_user_id, ch.name, 68, false)}
            <div style="font-size:20px;font-weight:600;margin-top:10px">${esc(ch.name)}</div>
            <div style="font-size:13.5px;color:var(--text-muted);margin-top:2px">Start of your private conversation with ${esc(ch.name)}.</div>
          </div>
          ${msgHtml}
        </div>
      </div>

      <div class="composer-dock">
        <div class="composer-inner">
          <div class="typing-row" id="typing-row"></div>
          ${state.replyTo ? `<div class="reply-banner"><span>Replying to <b>${esc(state.replyTo.user)}</b>: ${esc(state.replyTo.text.slice(0,50))}</span><button id="cancel-reply">${SVG.x}</button></div>` : ''}
          <div class="composer-pill ${state.replyTo ? 'has-reply' : ''}" style="position:relative">
            <button class="icon-btn" id="btn-composer-plus" style="width:32px;height:32px;border-radius:50%" title="Insert formatting / code block">${SVG.plus}</button>
            ${state.showAttachMenu ? `
              <div class="popover ${animAttach ? 'modal-enter' : ''}" style="position:absolute;left:0;bottom:48px;width:190px;padding:6px" onclick="event.stopPropagation()">
                <button class="opt-btn" data-insert-fmt="code" style="width:100%;text-align:left;border:none;background:transparent">Insert Code Block</button>
                <button class="opt-btn" data-insert-fmt="spoiler" style="width:100%;text-align:left;border:none;background:transparent">Insert Spoiler ||...||</button>
                <button class="opt-btn" data-insert-fmt="bold" style="width:100%;text-align:left;border:none;background:transparent">Insert Bold **...**</button>
              </div>` : ''}
            <input id="draft-input" value="${esc(state.draft)}" placeholder="Write to ${esc(ch.name)}..." autocomplete="off" />
            <button class="icon-btn" id="btn-composer-emoji" style="width:32px;height:32px" title="Emoji">${SVG.smile}</button>
            <button class="send-circle" id="btn-send" ${state.draft.trim() ? '' : 'disabled'} title="Send">${SVG.send}</button>
          </div>
        </div>
      </div>`;
  }

  function renderPeople(pendingAll) {
    const q = state.peopleSearch.trim().toLowerCase();
    const list = state.friends.filter(f => {
      if (q && !f.username.toLowerCase().includes(q)) return false;
      if (state.peopleTab === 'online') return f.status === 'accepted' && f.online;
      if (state.peopleTab === 'all') return f.status === 'accepted' || f.direction === 'mutual';
      if (state.peopleTab === 'pending') return f.status === 'pending';
      return false;
    });
    return `
      <header class="topbar">
        <div class="tabs-bar" id="people-tabs">
          <button class="icon-btn mobile-menu-btn" id="btn-mobile-menu" title="Menu">${SVG.menu}</button>
          <strong style="font-size:16px;margin-right:8px">People</strong>
          <button class="tab-btn ${state.peopleTab==='online'?'active':''}" data-ptab="online">Online</button>
          <button class="tab-btn ${state.peopleTab==='all'?'active':''}" data-ptab="all">All</button>
          <button class="tab-btn ${state.peopleTab==='pending'?'active':''}" data-ptab="pending">Requests ${pendingAll > 0 ? `<span class="pill-badge green badge-pop">${pendingAll}</span>` : ''}</button>
          <button class="tab-btn add-btn ${state.peopleTab==='add'?'active':''}" data-ptab="add">+ Add Friend</button>
          <div class="tab-indicator" id="tab-indicator"></div>
        </div>
      </header>
      <div class="people-body">
        <div class="people-col">
          ${state.peopleTab === 'add' ? `
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:520px;margin:24px auto;width:100%">
              <div style="font-size:18px;font-weight:600;margin-bottom:4px">Add a Friend</div>
              <div style="font-size:13.5px;color:var(--text-secondary);margin-bottom:16px">Connect using their Wireline username or email.</div>
              <form id="add-friend-form" style="display:flex;gap:8px">
                <input class="text-input" id="add-friend-input" placeholder="Username or email..." required />
                <button class="opt-btn active" type="submit" style="white-space:nowrap">Send Request</button>
              </form>
              ${state.addFriendErr ? `<div class="notice err">${esc(state.addFriendErr)}</div>` : ''}
            </div>` : `
            <div class="search-pill">${SVG.search}<input id="people-search" placeholder="Filter people..." value="${esc(state.peopleSearch)}" /></div>
            <div class="sec-label" style="margin-top:6px">${state.peopleTab.toUpperCase()} — ${list.length}</div>
            ${list.length ? list.map(f => `
              <div class="friend-card ${f.status === 'accepted' ? 'hover-slide' : ''}" data-fcard="${f.user_id}">
                <div style="display:flex;align-items:center;gap:12px">
                  <div class="avatar" style="width:38px;height:38px;background:${avColor(f.username,false)};font-size:15px">
                    ${esc(f.username[0]?.toUpperCase() || '?')}
                    ${f.status === 'accepted' ? `<span class="status-dot dot-${f.presence || 'offline'}" style="border-color:var(--surface)"></span>` : ''}
                  </div>
                  <div>
                    <div style="font-weight:600;font-size:14.5px">${esc(f.username)}</div>
                    <div style="font-size:12px;color:var(--text-muted);text-transform:capitalize">${f.status === 'pending' ? (f.direction === 'incoming' ? 'Incoming request' : 'Outgoing request') : (f.presence || 'offline')}</div>
                  </div>
                </div>
                <div class="friend-actions">
                  ${f.status === 'pending' ? (f.direction === 'incoming' ? `
                    <button class="circle-act accept" data-fresp="${f.user_id}" data-acc="1" title="Accept">${SVG.check}</button>
                    <button class="circle-act decline" data-fresp="${f.user_id}" data-acc="0" title="Decline">${SVG.x}</button>
                  ` : `<button class="circle-act decline" data-fresp="${f.user_id}" data-acc="0" title="Cancel Request">${SVG.x}</button>`) : `
                    <button class="circle-act" data-open-dm="${f.user_id}" title="Message">${SVG.chat}</button>
                    <button class="circle-act" data-call-dm="${f.user_id}" title="Call">${SVG.phone}</button>
                  `}
                </div>
              </div>`).join('') : `<div style="text-align:center;padding:56px 0;color:var(--text-muted)">Nothing here yet.</div>`}
          `}
        </div>
      </div>`;
  }

  function renderProfilePop(me, animate = false) {
    return `<div class="popover ${animate ? 'modal-enter' : ''}" style="top:66px;left:12px;width:236px" onclick="event.stopPropagation()">
      <div style="font-weight:600;font-size:15px">${esc(me.username)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">${esc(me.email)}</div>
      ${['online','away','dnd'].map(s => `<button class="opt-btn ${state.prefs.status===s?'active':''}" data-set-st="${s}" style="width:100%;text-align:left;margin-bottom:4px;text-transform:capitalize">${s === 'dnd' ? 'Do Not Disturb' : s}</button>`).join('')}
      <label class="opt-btn active" style="display:block;width:100%;text-align:center;margin-top:8px;cursor:pointer">
        Upload Profile Picture
        <input type="file" id="pop-avatar-file" accept="image/png,image/jpeg,image/webp" style="display:none" />
      </label>
      <button class="opt-btn" id="pop-logout" style="width:100%;margin-top:6px;color:var(--danger)">Log Out</button>
    </div>`;
  }

  function renderEmojiPicker(animate = false) {
    return `<div class="popover ${animate ? 'modal-enter' : ''}" style="bottom:74px;right:20px;width:320px">
      <div class="sec-label">PICK EMOJI</div>
      <div class="emoji-grid">${EMOJIS.map(e => `<button data-pick-em="${e}">${e}</button>`).join('')}</div>
    </div>`;
  }

  function renderSettings(animate = false) {
    const me = state.session;
    return `<div class="backdrop" id="settings-backdrop">
      <div class="settings-modal ${animate ? 'modal-enter' : ''}" onclick="event.stopPropagation()">
        <div class="settings-nav">
          <div class="sec-label" style="padding:4px 10px 8px">SETTINGS</div>
          <button class="${state.settingsTab==='account'?'active':''}" data-stab="account">My Account</button>
          <button class="${state.settingsTab==='appearance'?'active':''}" data-stab="appearance">Appearance</button>
          <button class="${state.settingsTab==='voice'?'active':''}" data-stab="voice">Audio & Devices</button>
          <button style="margin-top:auto;color:var(--danger)" id="set-logout">Log Out</button>
        </div>
        <div class="settings-content">
          <button class="icon-btn" id="close-settings" style="position:absolute;top:16px;right:16px">${SVG.x}</button>
          ${state.settingsTab === 'account' ? `
            <h2 style="font-size:20px;margin-bottom:16px">My Account</h2>
            <div style="display:flex;align-items:center;gap:16px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--border)">
              ${avatarHtml(me.user_id, me.username, 64, true)}
              <div>
                <div style="font-size:17px;font-weight:600">${esc(me.username)}</div>
                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">${esc(me.email)}</div>
                <label class="opt-btn active" style="display:inline-block;cursor:pointer">
                  Upload Profile Picture
                  <input type="file" id="set-avatar-file" accept="image/png,image/jpeg,image/webp" style="display:none" />
                </label>
                <div style="font-size:11.5px;color:var(--text-muted);margin-top:6px">Circular crop · PNG transparency supported</div>
              </div>
            </div>
          ` : state.settingsTab === 'appearance' ? `
            <h2 style="font-size:20px;margin-bottom:16px">Appearance</h2>
            <div class="sec-label">THEME</div>
            <div class="pill-row">
              <button class="opt-btn ${state.prefs.theme==='dark'?'active':''}" data-set-theme="dark">Midnight Dark</button>
              <button class="opt-btn ${state.prefs.theme==='light'?'active':''}" data-set-theme="light">Daylight Light</button>
            </div>
            <div class="sec-label" id="font-size-label" style="margin-top:18px">FONT SIZE (${state.prefs.fontSize}px)</div>
            <input type="range" min="12" max="20" value="${state.prefs.fontSize}" id="font-slider" style="margin-top:8px;width:220px" />
          ` : `
            <h2 style="font-size:20px;margin-bottom:16px">Audio & Devices</h2>
            <div class="sec-label">MICROPHONE (INPUT)</div>
            <select class="text-input" id="sel-mic" style="margin-top:6px;max-width:360px">
              <option value="">System Default</option>
              ${(state.mics || []).map(d => `<option value="${esc(d.deviceId)}" ${state.prefs.micId===d.deviceId?'selected':''}>${esc(d.label || 'Microphone')}</option>`).join('')}
            </select>
            <div class="sec-label" style="margin-top:16px">SPEAKERS / HEADPHONES (OUTPUT)</div>
            <select class="text-input" id="sel-spk" style="margin-top:6px;max-width:360px">
              <option value="">System Default</option>
              ${(state.speakers || []).map(d => `<option value="${esc(d.deviceId)}" ${state.prefs.spkId===d.deviceId?'selected':''}>${esc(d.label || 'Speaker')}</option>`).join('')}
            </select>
            <div class="sec-label" style="margin-top:18px">APP SOUND EFFECTS</div>
            <div class="pill-row">
              <button class="opt-btn ${state.prefs.sounds?'active':''}" data-set-sfx="1">Sounds On</button>
              <button class="opt-btn ${!state.prefs.sounds?'active':''}" data-set-sfx="0">Sounds Off</button>
              <button class="opt-btn" id="btn-test-sfx">Test Sound</button>
            </div>
            <div style="margin-top:14px;font-size:12px;color:var(--text-muted)">Call & stream settings (Mute, Deafen, 480p/720p/1080p, 15/30/60 FPS) live directly inside the Call panel.</div>
          `}
        </div>
      </div>
    </div>`;
  }

  function bindEvents(activeCh) {
    const q = id => document.getElementById(id);
    if (q('btn-theme')) q('btn-theme').onclick = () => { state.prefs.theme = state.prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); SFX.click(); render(); };
    if (q('btn-settings')) q('btn-settings').onclick = () => {
      state.showSettings = true; SFX.click(); render();
      if (navigator.mediaDevices?.enumerateDevices) {
        navigator.mediaDevices.enumerateDevices().then(devs => {
          state.mics = devs.filter(d => d.kind === 'audioinput');
          state.speakers = devs.filter(d => d.kind === 'audiooutput');
          if (state.showSettings && state.settingsTab === 'voice') render();
        }).catch(() => {});
      }
    };
    if (q('btn-profile-pop')) q('btn-profile-pop').onclick = (e) => { e.stopPropagation(); state.showProfilePop = !state.showProfilePop; SFX.click(); render(); };
    if (q('btn-mobile-menu')) q('btn-mobile-menu').onclick = (e) => { e.stopPropagation(); state.mobileSidebarOpen = !state.mobileSidebarOpen; render(); };
    if (q('mobile-drawer-bg')) q('mobile-drawer-bg').onclick = () => { state.mobileSidebarOpen = false; render(); };
    if (q('nav-people')) q('nav-people').onclick = () => { state.selectedChannel = null; state.mobileSidebarOpen = false; SFX.click(); render(); };
    if (q('nav-chats')) q('nav-chats').onclick = () => { state.mobileSidebarOpen = false; if (!state.selectedChannel && state.channels.length) selectChannel(state.channels[0].id); else render(); };
    if (q('btn-new-dm')) q('btn-new-dm').onclick = () => { state.selectedChannel = null; state.peopleTab = 'all'; state.mobileSidebarOpen = false; SFX.click(); render(); };
    if (q('side-search')) q('side-search').oninput = e => { state.chatSearch = e.target.value; render(); q('side-search')?.focus(); };

    document.querySelectorAll('[data-ch]').forEach(el => el.onclick = () => selectChannel(Number(el.dataset.ch)));
    if (q('side-mute')) q('side-mute').onclick = () => { state.muted = !state.muted; wsSend({ type: 'set_voice_state', muted: state.muted, deafened: state.deafened, speaking: false }); (state.muted ? SFX.mute : SFX.unmute)(); render(); };
    if (q('side-deaf')) q('side-deaf').onclick = () => { state.deafened = !state.deafened; wsSend({ type: 'set_voice_state', muted: state.muted, deafened: state.deafened, speaking: false }); render(); };
    if (q('side-share')) q('side-share').onclick = toggleScreenShare;
    if (q('side-hangup')) q('side-hangup').onclick = leaveCall;
    if (q('ans-call')) q('ans-call').onclick = () => { const chId = state.incomingCall.chId; state.incomingCall = null; selectChannel(chId); startCall(chId); };
    if (q('dec-call')) q('dec-call').onclick = () => { state.incomingCall = null; SFX.click(); render(); };

    if (activeCh) {
      if (q('btn-call')) q('btn-call').onclick = () => {
        if (state.inVoice && state.voiceRoom === `channel:${activeCh.id}`) { state.callExpanded = !state.callExpanded; SFX.click(); render(); }
        else startCall(activeCh.id);
      };
      if (q('btn-join-waiting')) q('btn-join-waiting').onclick = () => startCall(activeCh.id);
      if (q('btn-toggle-stream')) q('btn-toggle-stream').onclick = () => { state.streamMinimized = !state.streamMinimized; SFX.click(); render(); };
      if (q('pip-expand')) q('pip-expand').onclick = () => { state.streamMinimized = false; SFX.click(); render(); };
      if (q('btn-msg-search')) q('btn-msg-search').onclick = () => { state.msgSearchOpen = true; render(); q('msg-search-input')?.focus(); };
      if (q('close-msg-search')) q('close-msg-search').onclick = () => { state.msgSearchOpen = false; state.msgSearch = ''; render(); };
      if (q('msg-search-input')) q('msg-search-input').oninput = e => { state.msgSearch = e.target.value; render(); q('msg-search-input')?.focus(); };
      if (q('btn-hide-call')) q('btn-hide-call').onclick = () => { state.callExpanded = false; SFX.click(); render(); };
      if (q('stage-share')) q('stage-share').onclick = toggleScreenShare;
      if (q('stage-mute')) q('stage-mute').onclick = () => { state.muted = !state.muted; wsSend({ type: 'set_voice_state', muted: state.muted, deafened: state.deafened, speaking: false }); (state.muted ? SFX.mute : SFX.unmute)(); render(); };
      if (q('stage-deaf')) q('stage-deaf').onclick = () => { state.deafened = !state.deafened; wsSend({ type: 'set_voice_state', muted: state.muted, deafened: state.deafened, speaking: false }); render(); };
      if (q('stage-hangup')) q('stage-hangup').onclick = leaveCall;

      // Draggable call stage resizer
      const grip = q('call-resize-grip'), stage = q('call-stage');
      if (grip && stage) {
        grip.onmousedown = (e) => {
          e.preventDefault();
          const startY = e.clientY, startH = state.prefs.callHeight;
          const onMove = (ev) => {
            const h = Math.max(180, Math.min(window.innerHeight - 160, startH + (ev.clientY - startY)));
            state.prefs.callHeight = Math.round(h);
            stage.style.height = state.prefs.callHeight + 'px';
          };
          const onUp = () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); savePrefs(); };
          window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
        };
      }
      document.querySelectorAll('[data-csz]').forEach(b => b.onclick = () => { state.prefs.callHeight = Number(b.dataset.csz); savePrefs(); SFX.click(); render(); });

      if (q('btn-send')) q('btn-send').onclick = sendDraft;
      if (q('btn-composer-plus')) q('btn-composer-plus').onclick = (e) => { e.stopPropagation(); state.showAttachMenu = !state.showAttachMenu; state.emojiTarget = undefined; SFX.click(); render(); };
      document.querySelectorAll('[data-insert-fmt]').forEach(b => b.onclick = (e) => {
        e.stopPropagation();
        const kind = b.dataset.insertFmt;
        const snippet = kind === 'code' ? '```\n\n```' : kind === 'spoiler' ? '||spoiler||' : '**bold**';
        state.draft = (state.draft || '') + (state.draft && !state.draft.endsWith(' ') ? ' ' : '') + snippet;
        state.showAttachMenu = false;
        SFX.click();
        render();
        const el = q('draft-input'); if (el) el.focus();
      });
      if (q('btn-composer-emoji')) q('btn-composer-emoji').onclick = (e) => { e.stopPropagation(); state.showAttachMenu = false; state.emojiTarget = state.emojiTarget === null ? undefined : null; render(); };
      if (q('cancel-reply')) q('cancel-reply').onclick = () => { state.replyTo = null; render(); };
      const draft = q('draft-input');
      if (draft) {
        draft.onkeydown = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDraft(); }
          if (e.key === 'ArrowUp' && !draft.value) {
            const last = [...state.messages].reverse().find(x => x.user_id === state.session.user_id);
            if (last) { state.editingId = last.id; state.editDraft = last.content; render(); q('edit-input')?.focus(); }
          }
        };
        draft.oninput = () => {
          state.draft = draft.value;
          const sendBtn = q('btn-send');
          if (sendBtn) sendBtn.disabled = !draft.value.trim();
          if (Date.now() - lastTypingSent > 2500) { lastTypingSent = Date.now(); wsSend({ type: 'typing', channel_id: activeCh.id }); }
        };
      }
      document.querySelectorAll('[data-open-em]').forEach(b => b.onclick = (e) => { e.stopPropagation(); state.emojiTarget = Number(b.dataset.openEm); render(); });
      document.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => {
        const m = state.messages.find(x => x.id === Number(b.dataset.reply));
        if (m) { state.replyTo = { id: m.id, user: m.username, text: m.content }; render(); q('draft-input')?.focus(); }
      });
      document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
        const m = state.messages.find(x => x.id === Number(b.dataset.edit));
        if (m) { state.editingId = m.id; state.editDraft = m.content; render(); q('edit-input')?.focus(); }
      });
      document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        await api(`/api/messages/${Number(b.dataset.del)}`, { method: 'DELETE' });
      });
      document.querySelectorAll('[data-react-msg]').forEach(b => b.onclick = () => {
        wsSend({ type: 'toggle_reaction', channel_id: activeCh.id, message_id: Number(b.dataset.reactMsg), emoji: b.dataset.reactEm });
        SFX.react();
      });
      if (q('save-edit')) q('save-edit').onclick = async () => {
        const val = q('edit-input').value.trim();
        if (val) await api(`/api/messages/${state.editingId}`, { method: 'PATCH', body: JSON.stringify({ content: val }) });
        state.editingId = null; render();
      };
      if (q('cancel-edit')) q('cancel-edit').onclick = () => { state.editingId = null; render(); };
    } else {
      // Sliding tab underline measurement
      const bar = q('people-tabs'), ind = q('tab-indicator');
      const activeBtn = bar?.querySelector('.tab-btn.active');
      if (ind && activeBtn) { ind.style.left = activeBtn.offsetLeft + 'px'; ind.style.width = activeBtn.offsetWidth + 'px'; }
      document.querySelectorAll('[data-ptab]').forEach(b => b.onclick = () => { state.peopleTab = b.dataset.ptab; state.addFriendErr = ''; SFX.click(); render(); });
      if (q('people-search')) q('people-search').oninput = e => { state.peopleSearch = e.target.value; render(); q('people-search')?.focus(); };
      if (q('add-friend-form')) q('add-friend-form').onsubmit = async (e) => {
        e.preventDefault();
        try {
          await api('/api/friends/request', { method: 'POST', body: JSON.stringify({ query: q('add-friend-input').value.trim() }) });
          q('add-friend-input').value = ''; state.addFriendErr = ''; SFX.friend(); loadFriends();
        } catch (err) { state.addFriendErr = err.message; render(); }
      };
      document.querySelectorAll('[data-fresp]').forEach(b => b.onclick = () => {
        const uid = Number(b.dataset.fresp), acc = b.dataset.acc === '1';
        const card = document.querySelector(`[data-fcard="${uid}"]`);
        if (card) card.classList.add('removing');
        (acc ? SFX.friend : SFX.click)();
        setTimeout(async () => {
          await api('/api/friends/respond', { method: 'POST', body: JSON.stringify({ requester_id: uid, accept: acc }) });
          loadFriends(); if (acc) loadChannels();
        }, 250);
      });
      document.querySelectorAll('[data-open-dm]').forEach(b => b.onclick = () => openDm(Number(b.dataset.openDm), false));
      document.querySelectorAll('[data-call-dm]').forEach(b => b.onclick = () => openDm(Number(b.dataset.callDm), true));
    }

    // Popovers & Settings
    document.querySelectorAll('[data-set-st]').forEach(b => b.onclick = () => {
      state.prefs.status = b.dataset.setSt; savePrefs(); wsSend({ type: 'set_presence', status: state.prefs.status }); state.showProfilePop = false; SFX.click(); render();
    });
    if (q('pop-logout')) q('pop-logout').onclick = () => signOut();
    if (q('pop-avatar-file')) q('pop-avatar-file').onchange = (e) => { if (e.target.files?.[0]) { state.showProfilePop = false; uploadAvatarFile(e.target.files[0]); } };
    if (q('set-avatar-file')) q('set-avatar-file').onchange = (e) => { if (e.target.files?.[0]) uploadAvatarFile(e.target.files[0]); };
    document.querySelectorAll('[data-pick-em]').forEach(b => b.onclick = () => {
      const em = b.dataset.pickEm;
      if (typeof state.emojiTarget === 'number' && state.selectedChannel) {
        wsSend({ type: 'toggle_reaction', channel_id: state.selectedChannel, message_id: state.emojiTarget, emoji: em });
        SFX.react();
      } else {
        state.draft = (state.draft || '') + em;
        const inp = q('draft-input'); if (inp) { inp.value = state.draft; inp.focus(); }
      }
      state.emojiTarget = undefined; render();
    });
    if (q('settings-backdrop')) q('settings-backdrop').onclick = () => { state.showSettings = false; render(); };
    if (q('close-settings')) q('close-settings').onclick = () => { state.showSettings = false; render(); };
    if (q('set-logout')) q('set-logout').onclick = () => signOut();
    document.querySelectorAll('[data-stab]').forEach(b => b.onclick = () => { state.settingsTab = b.dataset.stab; SFX.click(); render(); });
    document.querySelectorAll('[data-set-theme]').forEach(b => b.onclick = () => { state.prefs.theme = b.dataset.setTheme; savePrefs(); SFX.click(); render(); });
    document.querySelectorAll('[data-set-sfx]').forEach(b => b.onclick = () => { state.prefs.sounds = b.dataset.setSfx === '1'; savePrefs(); if (state.prefs.sounds) SFX.react(); render(); });
    document.querySelectorAll('[data-res]').forEach(b => b.onclick = () => { state.prefs.screenRes = Number(b.dataset.res); savePrefs(); SFX.click(); render(); });
    document.querySelectorAll('[data-fps]').forEach(b => b.onclick = () => { state.prefs.screenFps = Number(b.dataset.fps); savePrefs(); SFX.click(); render(); });
    if (q('font-slider')) q('font-slider').oninput = e => {
      state.prefs.fontSize = Number(e.target.value);
      savePrefs();
      const lbl = q('font-size-label');
      if (lbl) lbl.textContent = `FONT SIZE (${state.prefs.fontSize}px)`;
    };
    if (q('sel-mic')) q('sel-mic').onchange = e => { state.prefs.micId = e.target.value; savePrefs(); SFX.click(); };
    if (q('sel-spk')) q('sel-spk').onchange = e => { state.prefs.spkId = e.target.value; savePrefs(); SFX.click(); };
    if (q('btn-test-sfx')) q('btn-test-sfx').onclick = () => SFX.callJoin();
  }

  document.addEventListener('click', () => {
    let changed = false;
    if (state.showProfilePop) { state.showProfilePop = false; changed = true; }
    if (state.showAttachMenu) { state.showAttachMenu = false; changed = true; }
    if (state.emojiTarget !== undefined) { state.emojiTarget = undefined; changed = true; }
    if (changed) render();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (state.showSettings) { state.showSettings = false; render(); }
      else if (state.emojiTarget !== undefined) { state.emojiTarget = undefined; render(); }
      else if (state.showProfilePop) { state.showProfilePop = false; render(); }
      else if (state.replyTo) { state.replyTo = null; render(); }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('side-search')?.focus(); }
  });

  render();
  if (state.session) connectWs();
})();
</script>
</body>
</html>
