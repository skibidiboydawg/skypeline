<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireline</title>
<style>
:root, [data-theme="dark"] {
  --canvas: #0e1016;
  --sidebar: #131620;
  --surface: #1b1f2d;
  --surface-alt: #23293b;
  --floating: #151925;
  --hover: #202637;
  --active: #282f46;
  --input-bg: #181c28;
  --border: rgba(255, 255, 255, 0.08);
  --hairline: rgba(255, 255, 255, 0.06);
  --text-primary: #f5f7fc;
  --text-secondary: #c5cee0;
  --text-muted: #94a0b8;
  --text-link: #60a5fa;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-soft: #252a56;
  --own-bubble: #4f46e5;
  --own-text: #ffffff;
  --peer-bubble: #1b1f2d;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.48);
}
[data-theme="light"] {
  --canvas: #ffffff;
  --sidebar: #f4f6fa;
  --surface: #eef1f7;
  --surface-alt: #e3e8f2;
  --floating: #ffffff;
  --hover: #e9edf5;
  --active: #dfe5f7;
  --input-bg: #f1f4f9;
  --border: #dce2ee;
  --hairline: #e5eaf2;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-link: #2563eb;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #e0e7ff;
  --own-bubble: #4f46e5;
  --own-text: #ffffff;
  --peer-bubble: #f1f5f9;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  background: var(--canvas); color: var(--text-primary);
  font-size: var(--chat-font-size, 15.5px);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Animations */
@keyframes messageIn {
  0% { opacity: 0; transform: translateY(8px) scale(0.97); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.01); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.msg-new { animation: messageIn 200ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

@keyframes onlinePulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45); }
  70% { box-shadow: 0 0 0 4px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.dot-online { background: var(--success); animation: onlinePulse 2.5s ease-out infinite; }
.dot-away { background: var(--warning); }
.dot-dnd { background: var(--danger); }
.dot-offline { background: var(--text-muted); }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}
.typing-dots span {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-secondary); margin-right: 3px;
  animation: typingBounce 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.30s; }

@keyframes slideOutRight {
  0% { opacity: 1; transform: translateX(0); max-height: 76px; }
  100% { opacity: 0; transform: translateX(40px); max-height: 0; padding: 0; margin: 0; border-width: 0; }
}
.removing { animation: slideOutRight 250ms ease-in forwards; overflow: hidden; pointer-events: none; }

@keyframes badgePop {
  0% { transform: scale(0.5); }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.badge-pop { animation: badgePop 300ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

@keyframes modalIn {
  0% { opacity: 0; transform: scale(0.95); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes modalOut {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.95); }
}
.modal-enter { animation: modalIn 180ms cubic-bezier(0.4, 0, 0.2, 1) forwards; }
.modal-exit { animation: modalOut 150ms cubic-bezier(0.4, 0, 0.2, 1) forwards; }

@keyframes toastIn {
  0% { opacity: 0; transform: translateY(-16px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastOut {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-8px); }
}
@keyframes toastProgress {
  0% { width: 100%; }
  100% { width: 0%; }
}
.toast-enter { animation: toastIn 250ms ease forwards; }
.toast-exit { animation: toastOut 200ms ease forwards; }
.toast-bar { height: 2px; background: var(--accent); animation: toastProgress 4s linear forwards; border-radius: 2px; }
.toast-item:hover .toast-bar { animation-play-state: paused; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Auth Screen */
.auth-wrap {
  height: 100%; display: flex; align-items: center; justify-content: center;
  background: var(--sidebar); padding: 20px;
}
.auth-card {
  width: 100%; max-width: 420px; background: var(--canvas);
  border: 1px solid var(--border); border-radius: 16px; padding: 32px;
  box-shadow: var(--shadow);
}
.auth-card h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 6px; }
.auth-sub { font-size: 13.5px; color: var(--text-muted); text-align: center; margin-bottom: 22px; }
.field-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.04em; margin-bottom: 6px; margin-top: 12px; }
.text-input {
  width: 100%; background: var(--input-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none;
  transition: border-color 150ms ease;
}
.text-input:focus { border-color: var(--accent); }
.btn-primary {
  width: 100%; margin-top: 18px; padding: 11px; border-radius: 10px;
  background: var(--accent); color: #fff; font-weight: 600; font-size: 14.5px;
  transition: background 150ms ease;
}
.btn-primary:hover { background: var(--accent-hover); }
.auth-footer { margin-top: 14px; font-size: 13px; color: var(--text-muted); }
.auth-footer a { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: none; }
.notice { margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
.notice.err { color: var(--danger); }

/* App Shell */
.shell { display: flex; height: 100%; width: 100%; overflow: hidden; }
.sidebar {
  width: 282px; flex-shrink: 0; background: var(--sidebar);
  border-right: 1px solid var(--hairline); display: flex; flex-direction: column;
}
.profile-top {
  height: 64px; padding: 0 12px; border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.profile-chip {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  padding: 5px 8px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent; transition: background 140ms, border-color 140ms;
}
.profile-chip:hover { background: var(--hover); border-color: var(--border); }
.avatar {
  position: relative; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; color: #fff; font-weight: 600; flex-shrink: 0; user-select: none;
  background-color: var(--surface-alt);
}
.avatar img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
}
.status-dot {
  position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px;
  border-radius: 50%; border: 2.5px solid var(--sidebar);
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; display: inline-flex;
  align-items: center; justify-content: center; color: var(--text-secondary);
  border: 1px solid transparent; transition: background 140ms, color 140ms, border-color 140ms; flex-shrink: 0;
}
.icon-btn:hover { background: var(--hover); color: var(--text-primary); border-color: var(--border); }
.icon-btn.active { background: var(--accent); color: #fff; }
.icon-btn.danger { background: var(--danger); color: #fff; }
.icon-btn.success { background: var(--success); color: #fff; }

.side-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px; gap: 10px; }
.seg-switch {
  display: flex; background: var(--surface); border-radius: 10px; padding: 3px; gap: 3px;
}
.seg-btn {
  flex: 1; height: 30px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--text-secondary); display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 140ms, color 140ms;
}
.seg-btn.active { background: var(--floating); color: var(--text-primary); border: 1px solid var(--border); }
.seg-btn:not(.active):hover { background: var(--hover); }
.pill-badge {
  min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
.pill-badge.green { background: var(--success); }

.search-pill {
  display: flex; align-items: center; gap: 8px; background: var(--input-bg);
  border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px;
}
.search-pill input { flex: 1; border: none; background: transparent; outline: none; font-size: 13px; }
.sec-row { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
.sec-label { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.04em; }

.dm-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.dm-card {
  height: 58px; padding: 0 11px; border-radius: 11px; display: flex; align-items: center;
  gap: 11px; cursor: pointer; border: 1px solid transparent;
  transition: background 140ms, border-color 140ms; flex-shrink: 0;
}
.dm-card:hover { background: var(--hover); border-color: var(--border); }
.dm-card.active { background: var(--active); border-color: rgba(99, 102, 241, 0.4); }
.dm-meta { flex: 1; min-width: 0; }
.dm-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.dm-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-time { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; }
.dm-prev { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.call-float-card {
  margin: 0 10px 10px; padding: 12px; background: var(--floating);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
}
.call-float-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.call-float-btns button {
  height: 34px; border-radius: 8px; background: var(--surface); color: var(--text-primary);
  display: flex; align-items: center; justify-content: center;
}
.call-float-btns button:hover { background: var(--hover); }
.call-float-btns button.on-danger { background: var(--danger); color: #fff; }
.call-float-btns button.on-success { background: var(--success); color: #fff; }

/* Main Workspace */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); }
.topbar {
  height: 60px; padding: 0 22px; border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.call-pill-btn {
  height: 36px; padding: 0 15px; border-radius: 10px; background: var(--surface);
  border: 1px solid var(--border); color: var(--text-primary); font-size: 13.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px; transition: all 150ms ease;
}
.call-pill-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
.call-pill-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.35); }
.call-pill-btn.in-call { background: var(--success); border-color: var(--success); color: #fff; }

/* Scalable Call Stage */
.call-stage-wrap { padding: 10px 16px 0; flex-shrink: 0; }
.call-stage {
  background: #0a0c12; color: #f3f5fa; border-radius: 14px; border: 1px solid #23293a;
  display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.call-stage-hdr {
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.live-pill {
  background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 99px; letter-spacing: 0.04em;
}
.mini-pill {
  height: 24px; padding: 0 8px; border-radius: 6px; background: #1e2332; color: #d5dceb;
  font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;
}
.mini-pill:hover { background: #2b3247; }
.mini-pill.active { background: var(--accent); color: #fff; }
.call-stage-body {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: 4px 16px; gap: 14px; overflow: hidden;
}
.screen-view {
  max-width: 100%; max-height: 100%; border-radius: 10px; object-fit: contain; background: #000;
  border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}
.p-tile {
  width: 164px; height: 108px; border-radius: 12px; background: #171b26;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; border: 2px solid transparent; transition: border-color 150ms;
}
.p-tile.speaking { border-color: var(--success); }
.p-tile-name { position: absolute; left: 10px; bottom: 8px; font-size: 12px; font-weight: 600; }
.call-stage-dock {
  padding: 8px 0 12px; display: flex; align-items: center; justify-content: center; gap: 12px;
}
.call-circle {
  width: 42px; height: 42px; border-radius: 50%; background: #1e2332; color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 140ms, transform 140ms;
}
.call-circle:hover { background: #2b3247; transform: scale(1.05); }
.call-circle.on-white { background: #fff; color: #0a0c12; }
.call-circle.on-green { background: var(--success); color: #fff; }
.call-circle.on-red { background: var(--danger); color: #fff; }
.resize-grip {
  height: 12px; display: flex; align-items: center; justify-content: center; cursor: ns-resize;
}
.resize-grip span {
  width: 48px; height: 4px; border-radius: 2px; background: var(--border); transition: background 120ms;
}
.resize-grip:hover span { background: var(--accent); }

/* Chat Stream — full-width conversation feed with crisp 24px (px-6) horizontal padding */
.msg-scroll { flex: 1; overflow-y: auto; padding: 14px 24px; }
.msg-column { width: 100%; display: flex; flex-direction: column; gap: 2px; }
.date-pill {
  align-self: center; margin: 12px 0; padding: 4px 13px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary);
  font-size: 12px; font-weight: 600;
}
.call-event-card {
  align-self: center; margin: 10px 0; padding: 7px 15px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-primary);
  font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
}
.call-event-card.missed { border-color: rgba(239, 68, 68, 0.45); }
.msg-row {
  position: relative; display: flex; flex-direction: column; padding: 1.5px 0;
}
.msg-row.mine { align-items: flex-end; }
.msg-row.theirs { align-items: flex-start; }
.msg-inner { display: flex; align-items: flex-start; gap: 11px; max-width: min(72%, 680px); }
.msg-row.mine .msg-inner { flex-direction: row-reverse; }
.bubble {
  padding: 9px 14px; border-radius: 18px; line-height: 1.46; word-break: break-word;
  overflow-wrap: anywhere; font-size: var(--chat-font-size, 15.5px);
}
.msg-row.mine .bubble {
  background: linear-gradient(135deg, #5d56f6 0%, #4f46e5 100%);
  color: var(--own-text);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 1px 3px rgba(0, 0, 0, 0.22);
  border-bottom-right-radius: 5px;
}
.msg-row.mine.grouped .bubble { border-top-right-radius: 6px; }
.msg-row.mine.has-next .bubble { border-bottom-right-radius: 6px; }
.msg-row.theirs .bubble {
  background: var(--peer-bubble); color: var(--text-primary);
  border: 1px solid var(--border); border-top-left-radius: 5px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}
.msg-row.theirs.grouped .bubble { border-top-left-radius: 6px; }
.msg-row.theirs.has-next .bubble { border-bottom-left-radius: 6px; }
.msg-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
.reply-chip {
  font-size: 12px; color: var(--text-secondary); background: var(--surface);
  border-left: 2.5px solid var(--accent);
  padding: 4px 10px; border-radius: 6px 10px 10px 6px; margin-bottom: 4px; max-width: min(380px, 100%);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.reply-chip b { color: var(--accent); }
.reactions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.react-pill {
  padding: 2px 8px; border-radius: 10px; background: var(--surface);
  border: 1px solid var(--border); font-size: 12.5px; color: var(--text-secondary);
}
.react-pill.mine { background: var(--accent-soft); border-color: var(--accent); color: var(--text-primary); }
.hover-bar {
  position: absolute; top: -10px; background: var(--floating); border: 1px solid var(--border);
  border-radius: 8px; padding: 2px; display: none; gap: 2px; box-shadow: var(--shadow); z-index: 4;
}
.msg-row:hover .hover-bar { display: flex; }
.msg-row.mine .hover-bar { left: 8px; }
.msg-row.theirs .hover-bar { right: 8px; }
.hover-bar button { width: 26px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
.hover-bar button:hover { background: var(--hover); color: var(--text-primary); }
.hover-bar button.del:hover { background: var(--danger); color: #fff; }
.spoiler { background: var(--surface-alt); color: transparent; border-radius: 4px; padding: 0 4px; cursor: pointer; }
.spoiler.open { color: inherit; background: rgba(128,128,128,0.18); }
.code-inline { font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.22); }
.code-block { font-family: ui-monospace, Consolas, monospace; font-size: 0.88em; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,0.28); overflow-x: auto; margin: 4px 0; white-space: pre; }
.mention { background: var(--accent-soft); color: var(--accent); padding: 0 4px; border-radius: 4px; font-weight: 600; }
.msg-row.mine .mention { background: rgba(255,255,255,0.22); color: #fff; }

/* Composer — full width matching 24px (px-6) horizontal padding of the message feed */
.composer-dock { padding: 6px 24px 14px; border-top: 1px solid var(--hairline); flex-shrink: 0; }
.composer-inner { width: 100%; }
.typing-row { height: 20px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); padding-left: 8px; opacity: 0; transition: opacity 200ms ease; }
.typing-row.show { opacity: 1; }
.reply-banner {
  background: var(--surface); border: 1px solid var(--border); border-bottom: none;
  border-radius: 14px 14px 0 0; padding: 6px 14px; display: flex; align-items: center;
  justify-content: space-between; font-size: 12.5px; color: var(--text-secondary);
}
.composer-pill {
  display: flex; align-items: center; gap: 8px; background: var(--input-bg);
  border: 1px solid var(--border); border-radius: 22px; padding: 7px 9px 7px 14px;
  transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
}
.composer-pill:hover { border-color: rgba(255, 255, 255, 0.16); }
.composer-pill.has-reply { border-radius: 0 0 22px 22px; }
.composer-pill:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.24); }
.composer-pill input {
  flex: 1; border: none; background: transparent; outline: none; font-size: var(--chat-font-size, 15.5px); height: 30px;
}
.send-circle {
  width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.send-circle:disabled { background: var(--surface-alt); color: var(--text-muted); cursor: default; }

/* People Page */
.tabs-bar { position: relative; display: flex; align-items: center; gap: 6px; height: 100%; }
.tab-btn {
  height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
  color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px;
}
.tab-btn:hover { background: var(--hover); color: var(--text-primary); }
.tab-btn.active { color: var(--text-primary); }
.tab-btn.add-btn { background: var(--accent); color: #fff; }
.tab-btn.add-btn.active { background: var(--accent-soft); color: var(--accent); }
.tab-indicator {
  position: absolute; bottom: 0; height: 2.5px; background: var(--accent);
  border-radius: 2px; transition: left 150ms cubic-bezier(0.4, 0, 0.2, 1), width 150ms cubic-bezier(0.4, 0, 0.2, 1);
}
.people-body { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; }
.people-col { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 10px; }
.friend-card {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--border); transition: background 120ms;
}
.friend-card:hover { background: var(--hover); }
.friend-actions { display: flex; gap: 6px; }
.friend-card.hover-slide .friend-actions {
  opacity: 0.65; transform: translateX(3px); transition: opacity 150ms ease, transform 150ms ease;
}
.friend-card.hover-slide:hover .friend-actions { opacity: 1; transform: translateX(0); }
.circle-act {
  width: 34px; height: 34px; border-radius: 50%; background: var(--floating);
  border: 1px solid var(--border); color: var(--text-primary);
  display: inline-flex; align-items: center; justify-content: center;
}
.circle-act:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.circle-act.accept:hover { background: var(--success); border-color: var(--success); color: #fff; }
.circle-act.decline:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

/* Popovers, Modals, Toasts */
.backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.58); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px); z-index: 40;
  display: flex; align-items: center; justify-content: center;
}
.settings-modal {
  width: min(860px, calc(100vw - 32px)); height: min(620px, calc(100vh - 32px));
  background: var(--canvas); border: 1px solid var(--border); border-radius: 16px;
  display: flex; overflow: hidden; box-shadow: var(--shadow);
}
.settings-nav { width: 210px; background: var(--sidebar); border-right: 1px solid var(--hairline); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.settings-nav button { text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--text-secondary); }
.settings-nav button.active { background: var(--active); color: var(--text-primary); }
.settings-nav button:hover:not(.active) { background: var(--hover); }
.settings-content { flex: 1; padding: 24px 28px; overflow-y: auto; position: relative; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.opt-btn {
  padding: 8px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--text-primary); transition: background 140ms, border-color 140ms;
}
.opt-btn:hover:not(.active) { background: var(--hover); }
.opt-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.popover {
  position: fixed; z-index: 45; background: var(--floating); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow); padding: 12px;
}
.emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-height: 250px; overflow-y: auto; margin-top: 8px; }
.emoji-grid button { font-size: 20px; height: 36px; border-radius: 8px; }
.emoji-grid button:hover { background: var(--hover); }

.toast-stack { position: fixed; top: 64px; right: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(300px, calc(100vw - 32px)); }
.toast-item {
  background: var(--floating); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); padding: 12px 12px 8px; cursor: pointer; overflow: hidden;
}

.mobile-menu-btn { display: none; }
.mobile-drawer-bg { display: none; }

@media (max-width: 768px) {
  .mobile-menu-btn { display: inline-flex; }
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 310px); z-index: 35;
    transform: translateX(-105%); transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .mobile-drawer-bg {
    display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.52);
    backdrop-filter: blur(4px); z-index: 30;
  }
  .main { width: 100%; }
  .topbar { padding: 0 12px !important; }
  .msg-scroll { padding: 12px 14px; }
  .composer-dock { padding: 6px 12px 12px; }
  .msg-inner { max-width: 88%; }
  .settings-modal { flex-direction: column; width: calc(100vw - 20px); height: calc(100vh - 24px); }
  .settings-nav { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--hairline); padding: 10px 12px; }
  .settings-content { padding: 18px 16px; }
  .friend-card.hover-slide .friend-actions { opacity: 1; transform: none; }
}

  // Studio Web Audio synthesizer matching the desktop app
  let actx = null;
  function getAudio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function playTone(notes, gap = 0.015) {
    if (!state.prefs.sounds || state.deafened) return;
    try {
      const c = getAudio();
      let t = c.currentTime;
      for (const [f1, f2, dur, vol] of notes) {
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f1, t);
        if (f2 !== f1) osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(vol, t + dur * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(g); g.connect(c.destination);
        osc.start(t); osc.stop(t + dur + 0.01);
        t += dur + gap;
      }
    } catch {}
  }
  const SFX = {
    send: () => playTone([[420, 560, 0.055, 0.08]]),
    recv: () => playTone([[659, 659, 0.07, 0.1], [988, 988, 0.11, 0.09]], 0.02),
    callJoin: () => playTone([[523, 523, 0.07, 0.1], [659, 659, 0.07, 0.1], [784, 784, 0.14, 0.11]], 0.015),
    callLeave: () => playTone([[523, 523, 0.08, 0.1], [392, 392, 0.14, 0.1]], 0.015),
    ring: () => playTone([[784, 784, 0.09, 0.11], [988, 988, 0.09, 0.11], [1175, 1175, 0.15, 0.1]], 0.025),
    mute: () => playTone([[420, 270, 0.075, 0.1]]),
    unmute: () => playTone([[310, 480, 0.075, 0.1]]),
    shareOn: () => playTone([[587, 587, 0.07, 0.1], [880, 880, 0.13, 0.1]], 0.015),
    shareOff: () => playTone([[659, 659, 0.07, 0.09], [440, 440, 0.12, 0.09]], 0.015),

  function savePrefs() {
    localStorage.setItem('wl_prefs', JSON.stringify(state.prefs));
