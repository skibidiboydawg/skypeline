name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build Windows Setup, WebSetup, and Portable zip
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Wireline-Setup.exe
            dist/Wireline-WebSetup.exe
            dist/Wireline-*-Setup.exe
            dist/Wireline-*-Portable.zip

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libasound2-dev libgtk-3-dev \
            libssl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxdo-dev libdbus-1-dev libxcb1-dev
      - name: Build release client
        run: |
          cargo build --release -p skypeline-client
          mkdir -p dist
          cp target/release/skypeline-client dist/wireline
          tar -czf dist/wireline-linux-x86_64.tar.gz -C dist wireline
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/wireline-linux-x86_64.tar.gz

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
